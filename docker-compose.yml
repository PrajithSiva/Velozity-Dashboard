services:
  postgres:
    image: postgres:16-alpine
    container_name: velozity-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: velozity
      POSTGRES_PASSWORD: velozity
      POSTGRES_DB: velozity
    ports:
      - "5432:5432"
    volumes:
      - velozity_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U velozity"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  velozity_pgdata:
